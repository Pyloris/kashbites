# ==============================================================================
# KashBites Nginx Virtual Host Configuration
# For use behind Cloudflare / Hostinger Edge SSL Proxy (SSL Terminated at Edge)
#
# Place this file in: /etc/nginx/sites-available/kashbites.conf
#
# Activation:
#   sudo ln -sf /etc/nginx/sites-available/kashbites.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# Upstream pointing to the KashBites Frontend Docker container published on port 9099
upstream kashbites_upstream {
    server 127.0.0.1:9099;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kashbites.com www.kashbites.com;

    # Maximum file upload size (for product media and harvest assets)
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/kashbites_access.log;
    error_log /var/log/nginx/kashbites_error.log warn;

    # Security & Privacy Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy all traffic to KashBites on port 9099
    location / {
        proxy_pass http://kashbites_upstream;

        # Standard Proxy Headers
        proxy_set_header Host $host;

        # Real Client IP from Cloudflare / Hostinger Edge Proxy
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward the HTTPS scheme detected by Cloudflare/Hostinger edge
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # HTTP/1.1 and WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
