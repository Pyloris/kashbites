# ==============================================================================
# KashBites Nginx Virtual Host Configuration
# For use behind Cloudflare Flexible SSL (SSL Terminated at Cloudflare Edge)
#
# Place this file in: /etc/nginx/sites-available/kashbites.conf
#
# Activation:
#   sudo ln -sf /etc/nginx/sites-available/kashbites.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# Map Cloudflare X-Forwarded-Proto (default to $scheme if direct or not set)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Map port: 443 if Cloudflare forwarded https, else 80
map $forwarded_proto $forwarded_port {
    https   443;
    default 80;
}

# Real client IP from Cloudflare header with fallback to $remote_addr
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Upstream pointing to the KashBites Frontend Docker container published on port 9099
upstream kashbites_upstream {
    server 127.0.0.1:9099;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kashbites.com www.kashbites.com;

    # Maximum file upload size (for product media and harvest assets)
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/kashbites_access.log;
    error_log /var/log/nginx/kashbites_error.log warn;

    # Prevent Nginx from using port 80 or internal hostnames in redirects
    port_in_redirect off;
    server_name_in_redirect off;

    # Redirect HTTP to HTTPS safely without Cloudflare Flexible redirect loops
    if ($forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security & Privacy Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy all traffic to KashBites on port 9099
    location / {
        proxy_pass http://kashbites_upstream;

        # Rewrite any http:// redirects from upstream to https://
        proxy_redirect http:// https://;

        # Standard Proxy Headers
        proxy_set_header Host $host;

        # Real Client IP from Cloudflare
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward the proper HTTPS scheme and port to container
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;

        # HTTP/1.1 and WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
