services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: kashbites-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: kashbites
    volumes:
      - mongodb_data:/data/db
    networks:
      - kashbites-network

  # MinIO S3-Compatible Object Storage for Static Media (Product & Review Images)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: kashbites-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kashbites_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kashbites-network

  # MinIO Bucket Provisioning (Creates public media buckets automatically)
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: kashbites-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /usr/bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-kashbites_admin} $${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026};
      /usr/bin/mc mb --ignore-existing local/kashbites-media;
      /usr/bin/mc anonymous set download local/kashbites-media;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kashbites_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026}
    networks:
      - kashbites-network

  # Redis Cache & Message Queue for BullMQ
  redis:
    image: redis:7-alpine
    container_name: kashbites-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - kashbites-network

  # Node.js + Express Backend Service
  backend:
    image: ghcr.io/pyloris/kashbites-backend:latest
    container_name: kashbites-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/kashbites
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-kashbites_super_secret_jwt_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:9099}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kashbites_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-kashbites-media}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9099}
    depends_on:
      - mongodb
      - minio
      - redis
    networks:
      - kashbites-network

  # Background Workers Service (BullMQ consumers)
  workers:
    image: ghcr.io/pyloris/kashbites-backend:latest
    container_name: kashbites-workers
    command: ["node", "src/workers/main.js"]
    restart: always
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/kashbites
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - kashbites-network

  # React Storefront Frontend Service (UI)
  frontend:
    image: ghcr.io/pyloris/kashbites-frontend:latest
    container_name: kashbites-frontend
    restart: always
    ports:
      - "9099:80"
    environment:
      VITE_API_BASE_URL: /api
      VITE_MINIO_PUBLIC_URL: /kashbites-media
    depends_on:
      - backend
    networks:
      - kashbites-network

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local

networks:
  kashbites-network:
    driver: bridge

