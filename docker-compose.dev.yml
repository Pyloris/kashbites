services:
  mongodb:
  # MongoDB Database Service for Local Development
    image: mongo:7.0
    container_name: kashbites-dev-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: kashbites
    volumes:
      - mongodb_data:/data/db
    networks:
      - kashbites-dev-network

  # MinIO S3-Compatible Object Storage for Local Development
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: kashbites-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API Port
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Web Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kashbites_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kashbites-dev-network

  # MinIO Bucket Auto-Provisioning (Initializes 'kashbites-media' bucket)
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: kashbites-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /usr/bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-kashbites_admin} $${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026};
      /usr/bin/mc mb --ignore-existing local/kashbites-media;
      /usr/bin/mc anonymous set download local/kashbites-media;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kashbites_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kashbites_minio_secret_2026}
    networks:
      - kashbites-dev-network

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local

networks:
  kashbites-dev-network:
    driver: bridge
