version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: kashbites-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kashbites
    volumes:
      - mongodb_data:/data/db
    networks:
      - kashbites-network

  # Node.js + Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kashbites-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/kashbites
      JWT_SECRET: kashbites_super_secret_jwt_key_2026
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - kashbites-network

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kashbites-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - kashbites-network

volumes:
  mongodb_data:
    driver: local

networks:
  kashbites-network:
    driver: bridge
